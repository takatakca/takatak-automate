name: TAKATAK CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies with build plugins
        run: npm install --include=dev --no-audit --no-fund
      - name: Build frontend
        run: npm run build
      - name: Assert deployable Nitro output
        run: |
          test -f .output/server/index.mjs || test -f dist/server/index.mjs
          test -d .output/public || test -d dist/client
      - name: Smoke test the actual Node server and public homepage
        env:
          NODE_ENV: production
          PORT: '3147'
        run: |
          set -euo pipefail
          node start.mjs > "$RUNNER_TEMP/takatak-server.log" 2>&1 &
          server_pid=$!
          trap 'cat "$RUNNER_TEMP/takatak-server.log"; kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3147/healthz > /dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "TAKATAK process exited before health check"
              exit 1
            fi
            sleep 1
          done
          test "$ready" -eq 1
          curl --fail --silent --show-error http://127.0.0.1:3147/healthz
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:3147/

  backend:
    name: Backend Prisma and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Typecheck
        run: npm run typecheck
      - name: Contract security regression tests
        run: npm run test:security
